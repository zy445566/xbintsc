name: Release

# Manually triggered release. Bumps the package version, pushes the commit and
# the matching git tag, publishes to npm, and creates the GitHub Release with
# the self-hosted binaries built by CI for that commit.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump to apply before releasing"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      ci_run_id:
        description: "CI run id holding the self-hosted binaries (default: the successful CI run for the released commit)"
        required: false
        type: string

# Serialize runs so two quick dispatches cannot race on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version commit + tag, create the GitHub release
  actions: read # download the self-hosted binaries from the CI workflow run
  id-token: write # required by npm OIDC publishing / provenance

jobs:
  release:
    name: Bump, publish and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch tags so the version/tag checks are accurate
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The local git hook was removed, so the version bump happens here: commit
      # the new package.json/package-lock.json, tag it, and push both.
      - name: Bump version and push the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          npm version "${{ inputs.bump }}" -m "chore(release): v%s"

          current="$(node -p "require('./package.json').version")"
          tag="v${current}"
          sha="$(git rev-parse HEAD)"

          echo "release version : ${current}"
          echo "release tag     : ${tag}"
          echo "release commit  : ${sha}"

          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${tag}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # `prepublishOnly` also runs `npm run build`, but building here first
      # keeps the publish step's work visible and lets us inspect the tarball.
      - name: Build
        run: npm run build

      - name: Preview package contents
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN needed: npm authenticates via GitHub OIDC
      # (id-token: write) against the npm trusted publisher config.
      - name: Publish to npm
        run: npm publish --provenance

      # Collect the self-hosted compiler binaries that CI built for the release
      # commit, and stage them under release-friendly names.
      - name: Download the self-hosted compiler artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
          INPUT_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail

          # Either use an explicitly requested CI run, or wait (bounded) for the
          # CI run covering the release commit to finish, so a release dispatched
          # right after the version push still finds its binaries.
          run_id="${INPUT_RUN_ID:-}"
          conclusion=""
          if [ -n "${run_id}" ]; then
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
          else
            deadline=$(( SECONDS + 1800 ))
            while :; do
              read -r run_id status conclusion <<<"$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last | "\(.id) \(.status) \(.conclusion)"')"

              if [ -n "${run_id}" ] && [ "${run_id}" != "null" ] && [ "${status}" = "completed" ]; then
                break
              fi
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "::error::Timed out waiting for a CI run for ${SHA}." >&2
                exit 1
              fi
              echo "Waiting for CI run for ${SHA} (status: ${status:-none})..."
              sleep 20
            done
          fi

          if [ "${conclusion}" != "success" ]; then
            echo "::error::CI run ${run_id} concluded '${conclusion}'; cannot fetch self-hosted binaries." >&2
            exit 1
          fi
          echo "Using binaries from CI run ${run_id}."

          rm -rf .ci-artifacts release-assets
          gh run download "${run_id}" --pattern 'xbintsc-*' --dir .ci-artifacts

          mkdir -p release-assets
          shopt -s nullglob
          for dir in .ci-artifacts/xbintsc-*; do
            [ -d "${dir}" ] || continue
            slug="$(basename "${dir}" | tr '[:upper:]' '[:lower:]')"
            for file in "${dir}"/*; do
              [ -f "${file}" ] || continue
              case "${file}" in
                *.exe) cp "${file}" "release-assets/${slug}.exe" ;;
                *)     cp "${file}" "release-assets/${slug}" ;;
              esac
            done
          done

          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No self-hosted binaries were found in CI run ${run_id}." >&2
            exit 1
          fi
          ls -l release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "${TAG}" --title "${TAG}" --generate-notes release-assets/*
