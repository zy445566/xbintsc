name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The compiler resolves its C toolchain as: bundled `vendor/<os>-<arch>/` first,
# then the system `PATH` (see `src/driver/toolchain-provider.ts`). We deliberately
# do not pin `xbintsc_CLANG` here so each job can pick the right one — on Windows
# arm64 the image's clang targets the MSVC ABI while we ship MinGW-w64, so that
# job fetches and uses the bundled toolchain instead.

# Every host architecture is covered, but these are native builds, not
# cross-compilation: each runner builds and tests its own architecture.
#   Linux x64      -> ubuntu-latest
#   Linux arm64    -> ubuntu-24.04-arm
#   macOS x64      -> macos-15-intel
#   macOS arm64    -> macos-15
#   Windows x64    -> windows-latest
#   Windows arm64  -> windows-11-arm

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
        node: ["22","26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      # Windows arm64 has no MinGW-w64 clang in the image and the MSVC one emits
      # MSVC-ABI objects, so it uses the bundled llvm-mingw toolchain instead.
      - name: Install clang (Windows x64)
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # clang on Windows needs the MSVC/SDK environment (INCLUDE, LIB, PATH)
      # to find the C standard library headers and the linker.
      # ilammy/msvc-dev-cmd still runs on Node 20 (which GitHub now forces onto
      # Node 24), so import the Visual Studio build environment directly instead
      # of depending on a deprecated action.
      - name: Set up the MSVC environment (Windows x64)
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath).Trim()
          if (-not $vsPath) { throw "Visual Studio C++ build tools were not found." }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }

          cmd /c "`"$vcvars`" x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Verify the toolchain
        if: "!(runner.os == 'Windows' && runner.arch == 'ARM64')"
        shell: bash
        run: clang --version

      - name: Install dependencies
        run: npm ci

      - name: Cache the bundled toolchain (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/driver/toolchain-download.ts') }}

      - name: Fetch the bundled toolchain (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: npx tsx scripts/fetch-toolchain.ts

      - name: Type check
        run: npm run typecheck

      - name: Build the runtime (and prebuilt archives)
        run: npm run runtime

      - name: Report the resolved toolchain
        run: npx tsx src/cli/main.ts doctor

      - name: Unit and end-to-end tests
        run: npm test

  compile-examples:
    name: Compile examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install clang (Windows x64)
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up the MSVC environment (Windows x64)
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath).Trim()
          if (-not $vsPath) { throw "Visual Studio C++ build tools were not found." }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }

          cmd /c "`"$vcvars`" x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - run: npm ci

      - name: Cache the bundled toolchain (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/driver/toolchain-download.ts') }}

      - name: Fetch the bundled toolchain (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: npx tsx scripts/fetch-toolchain.ts

      - name: Build the hello example
        run: npx tsx src/cli/main.ts build examples/hello.ts --out build/examples

      - name: Run the hello example (the CLI resolves the executable path per OS)
        run: npx tsx src/cli/main.ts run examples/hello.ts --out build/examples

      - name: Build and run the file-reading example with the node extension
        run: npx tsx src/cli/main.ts run examples/read-file.ts --ext node --out build/examples

  self-host:
    name: Self-host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install clang (Windows x64)
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up the MSVC environment (Windows x64)
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath).Trim()
          if (-not $vsPath) { throw "Visual Studio C++ build tools were not found." }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }

          cmd /c "`"$vcvars`" x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Install dependencies
        run: npm ci

      - name: Cache the bundled toolchain (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/driver/toolchain-download.ts') }}

      - name: Fetch the bundled toolchain (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: npx tsx scripts/fetch-toolchain.ts

      # Bootstrap the compiler with itself and prove the emitted LLVM IR is a
      # fixpoint: source -> gen1 binary -> gen2 IR == gen1 IR.
      - name: Bootstrap and verify the self-hosted compiler
        shell: bash
        run: |
          set -euo pipefail

          # A produced executable may carry a platform suffix (.exe).
          binary() {
            if [ -f "$1/$2.exe" ]; then echo "$1/$2.exe"; else echo "$1/$2"; fi
          }

          mkdir -p scratch dist

          # Reference IR: the source (TypeScript, run through tsx) compiles itself.
          npx tsx src/cli/main.ts emit src/cli/main.ts --ext node > scratch/ref.ll

          # Generation 1: the source compiler builds itself into a native binary.
          npx tsx src/cli/main.ts build src/cli/main.ts --ext node --out scratch/self --force
          gen1="$(binary scratch/self main)"

          # Generation 2: the self-hosted binary re-emits the IR and rebuilds itself.
          "${gen1}" emit src/cli/main.ts --ext node > scratch/gen2.ll
          "${gen1}" build src/cli/main.ts --ext node --out scratch/self2 --force
          gen2="$(binary scratch/self2 main)"

          # Generation 3: the second-generation binary re-emits the IR.
          "${gen2}" emit src/cli/main.ts --ext node > scratch/gen3.ll

          # The IR must be byte-for-byte identical across generations.
          diff scratch/ref.ll scratch/gen2.ll
          diff scratch/ref.ll scratch/gen3.ll
          echo "self-hosting fixpoint verified ($(wc -l < scratch/ref.ll) IR lines)"

          # Stage the self-hosted binary under a platform-stable name.
          case "${gen1}" in
            *.exe) cp "${gen1}" dist/xbintsc.exe ;;
            *)     cp "${gen1}" dist/xbintsc ;;
          esac
          ls -l dist

      - name: Upload the self-hosted compiler
        uses: actions/upload-artifact@v7
        with:
          name: xbintsc-${{ runner.os }}-${{ runner.arch }}
          path: dist/xbintsc*
          if-no-files-found: error
          retention-days: 90

  # Proves an end user needs no compiler installed: on Linux/Windows the toolchain
  # is fetched into vendor/ and used; on macOS the system Command Line Tools are
  # used (the recorded prerequisite).
  self-contained:
    name: Self-contained (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache the bundled toolchain
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/driver/toolchain-download.ts') }}

      - name: Fetch the bundled toolchain
        run: npx tsx scripts/fetch-toolchain.ts

      - name: Report the resolved toolchain
        run: npx tsx src/cli/main.ts doctor

      - name: Assert the bundled toolchain is used (Linux/Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: npx tsx src/cli/main.ts doctor | grep -q "(vendor)"

      - name: Build and run a program
        run: |
          npx tsx src/cli/main.ts build examples/hello.ts --out build/self-contained
          npx tsx src/cli/main.ts run examples/hello.ts --out build/self-contained

  # Assemble the self-contained release archives: the self-hosted binary plus the
  # bundled toolchain and prebuilt runtime, one per platform. `release.yml`
  # downloads these and attaches them to a GitHub Release.
  package:
    name: Package (${{ matrix.os }})
    needs: self-host
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Download the self-hosted compiler
        uses: actions/download-artifact@v8
        with:
          name: xbintsc-${{ runner.os }}-${{ runner.arch }}
          path: dist

      - name: Cache the bundled toolchain
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/driver/toolchain-download.ts') }}

      - name: Fetch the bundled toolchain
        run: npx tsx scripts/fetch-toolchain.ts

      - name: Build the prebuilt runtime archives
        run: npm run runtime

      - name: Assemble the release archive
        run: npm run package-release

      - name: Upload the release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          # Only the archives (and their .sha256), never the unpacked tree.
          path: dist/release/xbintsc-*.tar.*
          if-no-files-found: error
          retention-days: 90
