name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# xbintsc does not bundle a compiler: every job installs a clang-compatible
# toolchain and `src/driver/toolchain-provider.ts` resolves it. On Windows the
# target ABI is MSVC, so each Windows job uses `.github/actions/vs-toolchain`:
# it imports `vcvarsall` from the Visual Studio installation (Build Tools,
# Community, ...) and uses the LLVM bundled with that same installation. Local
# builds resolve the same VS toolchain, so CI, the prebuilt archives and a
# developer machine share one compiler chain.
#
# Every host architecture is covered, but these are native builds, not
# cross-compilation: each runner builds and tests its own architecture.
#   Linux x64      -> ubuntu-latest
#   Linux arm64    -> ubuntu-24.04-arm
#   macOS x64      -> macos-15-intel
#   macOS arm64    -> macos-15
#   Windows x64    -> windows-latest
#   Windows arm64  -> windows-11-arm

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # The documented minimum is clang 16 (opaque pointers). The matrix above uses
  # the runner's newer clang, so this job pins the oldest supported toolchain:
  # it catches codegen that silently starts requiring a newer LLVM, and proves
  # the version gate accepts exactly what doc/requirements.md promises.
  minimum-clang:
    name: Minimum clang 16
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install clang 16
        run: sudo apt-get update && sudo apt-get install -y clang-16 lld-16

      - name: Install dependencies
        run: npm ci

      - name: Verify the toolchain gate
        env:
          xbintsc_CLANG: clang-16
        run: npx tsx src/cli/main.ts doctor

      - name: Type check
        run: npm run typecheck

      - name: Unit and end-to-end tests (minimum clang)
        env:
          xbintsc_CLANG: clang-16
        run: npm test

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
        # A pull request only exercises Node.js 22: the full 22 + 26 sweep runs
        # on push to main/master and on dispatch.
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["22","26"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        # 'llvm' carries llvm-profdata/llvm-cov, which the runtime coverage
        # report below needs alongside clang.
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      # Windows uses the same Visual Studio installation a local build uses:
      # vcvarsall supplies MSVC, the Windows SDK and MSBuild, and the LLVM
      # bundled with Visual Studio is the compiler (`xbintsc_CLANG`). No
      # standalone/Chocolatey LLVM is installed, so the driver, CMake and the
      # prebuilt archives cannot end up on different compilers.
      - name: Set up the Visual Studio toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/vs-toolchain

      - name: Verify the toolchain
        shell: bash
        run: clang --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build the runtime (and prebuilt archives)
        run: npm run runtime

      - name: Report the resolved toolchain
        run: npx tsx src/cli/main.ts doctor

      # Coverage is enforced here: `vitest run --coverage` fails the job when
      # the global thresholds in vitest.config.ts are not met. The same run also
      # instruments the C runtime through clang: `CCC_OVERRIDE_OPTIONS` appends
      # the LLVM coverage flags to every compile/link the driver performs, so
      # `runtime/` can be reported next (V8 cannot see it).
      - name: Unit and end-to-end tests (with coverage)
        shell: bash
        env:
          CCC_OVERRIDE_OPTIONS: "+-fprofile-instr-generate +-fcoverage-mapping"
          LLVM_PROFILE_FILE: "${{ github.workspace }}/build/runtime-prof/%p-%m.profraw"
          xbintsc_CACHE_DIR: "${{ github.workspace }}/build/runtime-cov-cache"
          # A prebuilt runtime/lib archive is not instrumented; compile instead.
          xbintsc_PREFER_PREBUILT: "0"
        run: |
          mkdir -p build/runtime-prof
          npm test -- --coverage

      # Reports the C runtime coverage gathered above, and enforces a floor.
      # The script skips (rather than fails) on a host without a matching
      # llvm-profdata/llvm-cov, so the gate only applies where it can measure.
      # A full local run reaches ~85%; 80 leaves headroom for per-platform
      # differences in the compiled extensions.
      - name: Runtime (C) coverage
        run: npm run coverage:runtime -- --report-only --threshold 80

  compile-examples:
    name: Compile examples (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        # The GUI archive needs the X11/Wayland headers to see a window backend,
        # so every Linux job that builds it installs the same set from one place
        # (scripts/install-gui-deps.sh) rather than repeating the list per job.
        run: sudo sh scripts/install-gui-deps.sh

      # The same Visual Studio Build Tools/Community installation a local build
      # uses: vcvarsall (MSVC, SDK, MSBuild) plus its bundled LLVM. `make: true`
      # also installs GNU make for FFmpeg's configure on x64.
      - name: Set up the Visual Studio toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/vs-toolchain
        with:
          make: "true"

      - run: npm ci

      # Building SDL3/FreeType/HarfBuzz/glslang/SPIRV-Cross (and FFmpeg for the
      # media archive) from source is the slow part; cache the sources, keyed by
      # both build scripts (which pin the versions). actions/cache v5+ runs on
      # node24 (v4 still targets the deprecated node20). The *build* trees are
      # deliberately absent: a CMake build tree records the machine it was
      # configured on, so a cached one restored here carries that machine's
      # compiler path and its `SDL_X11`/`SDL_WAYLAND` choices into a configure
      # that must make its own. `scripts/build-gui.ts` keeps them at
      # `vendor/sdl-build`, `vendor/glslang-build` and `vendor/spirv-cross-build`,
      # outside every cached path.
      - name: Cache the GUI and media vendored libraries
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            vendor/SDL
            vendor/freetype
            vendor/freetype-build
            vendor/harfbuzz
            vendor/harfbuzz-build
            vendor/glslang
            vendor/spirv-cross
            vendor/ffmpeg
          key: gui-vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-gui.ts', 'scripts/build-media.ts') }}

      # The Windows media build has its own compile tree (MSVC objects cannot be
      # mixed with the POSIX one), so it gets a separate cache. Sources and the
      # installed prefix are relocatable; the configure/make tree is not (it
      # records absolute paths and the compiler from another machine), so it is
      # deliberately absent.
      - name: Cache the Windows GUI and media sources
        if: runner.os == 'Windows' && runner.arch == 'X64'
        uses: actions/cache@v5
        with:
          path: |
            vendor/SDL
            vendor/freetype
            vendor/harfbuzz
            vendor/glslang
            vendor/spirv-cross
            vendor/ffmpeg
            vendor/ffmpeg-build-msvc/dist
          key: windows-vendor-${{ runner.arch }}-${{ hashFiles('scripts/build-gui.ts', 'scripts/build-media.ts') }}

      - name: Build the hello example
        run: npx tsx src/cli/main.ts build examples/hello.ts --out build/examples

      - name: Run the hello example (the CLI resolves the executable path per OS)
        run: npx tsx src/cli/main.ts run examples/hello.ts --out build/examples

      - name: Build and run the file-reading example with the node extension
        run: npx tsx src/cli/main.ts run examples/node/read.ts --ext node --out build/examples

      # Native (C++/Rust) extensions are compiled to `extern "C"` objects/static
      # libraries and linked by xbintsc. The Windows job links with the MSVC ABI
      # (the system clang plus the Visual Studio tools), and each manifest's
      # `linkerFlagsByPlatform` block carries the platform-specific runtime
      # libraries.
      - name: Build the C++ native extension
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            export CXX=clang++
          fi
          bash examples/extensions/cpp/build.sh

      - name: Run the C++ native extension example
        run: npx tsx src/cli/main.ts run examples/extensions/cpp/demo.ts --ext-native examples/extensions/cpp/xbintsc.manifest.json --out build/examples

      - name: Build the Rust native extension
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            case "${{ runner.arch }}" in
              ARM64) rust_target=aarch64-pc-windows-msvc ;;
              *)     rust_target=x86_64-pc-windows-msvc ;;
            esac
            rustup target add "$rust_target"
            export RUST_TARGET="$rust_target"
          fi
          bash examples/extensions/rust/build.sh

      - name: Run the Rust native extension example
        run: npx tsx src/cli/main.ts run examples/extensions/rust/demo.ts --ext-native examples/extensions/rust/xbintsc.manifest.json --out build/examples

      # The GUI engine statically links SDL3 + FreeType + HarfBuzz into
      # `runtime/lib/<os>-<arch>/gui.a`. Building compiles those libraries from
      # source, so it is slower (they are cached per OS/arch).
      - name: Build the GUI archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: npm run gui

      # Media decoding is a separate opt-in archive (media.a). Building it makes
      # the media e2e suite run; the GUI-only suite covers the no-media path.
      - name: Build the media archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: npm run media

      # Windows x64 compiles both archives too. Building needs no GPU: gui.lib is
      # SDL3/FreeType/HarfBuzz for the MSVC ABI, and media.lib adds FFmpeg
      # compiled with clang-cl. Running them still needs a Vulkan driver, which
      # the hosted runner lacks, so the example run below stays provisional — but
      # a GUI+media *link* is checked here, which is what catches an unresolved
      # FFmpeg symbol or a missing system library.
      - name: Build the GUI and media archives (Windows x64)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        run: |
          npm run gui
          if ($LASTEXITCODE -ne 0) { throw "GUI archive build failed" }
          npm run media
          if ($LASTEXITCODE -ne 0) { throw "media archive build failed" }
          npx tsx src/cli/main.ts build examples/gui/media.ts --ext gui,media --out build/examples
          if ($LASTEXITCODE -ne 0) { throw "GUI+media link failed" }

      # Linux runs the example and the GUI e2e suite headlessly under Xvfb with
      # the lavapipe software Vulkan driver; this path is validated.
      - name: Run the GUI example + e2e tests (Linux, Xvfb)
        if: runner.os == 'Linux'
        env:
          XT_GUI_AUTOCLOSE_MS: "1500"
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            npx tsx src/cli/main.ts run examples/gui/hello.ts --ext gui --out build/examples
          # vitest positional filters are substrings, not globs, so
          # `tests/e2e/gui-*.test.ts` matches nothing. `tests/e2e/gui` covers
          # every split GUI e2e suite (gui-dom, gui-paint, ...).
          xvfb-run -a --server-args="-screen 0 1280x720x24" npx vitest run tests/e2e/gui

      # macOS runners may not expose a WindowServer to the process, so this run
      # is provisional (see doc/gui.md). A failure is recorded in the log and
      # swallowed: a `continue-on-error` step would still annotate the run with
      # a red error, so the commands are guarded explicitly instead.
      - name: Run the GUI example + e2e tests (macOS, provisional)
        if: runner.os == 'macOS'
        env:
          XT_GUI_AUTOCLOSE_MS: "1500"
        run: |
          set -uo pipefail
          if ! npx tsx src/cli/main.ts run examples/gui/hello.ts --ext gui --out build/examples; then
            echo "GUI example failed; the macOS run is provisional (see doc/gui.md)."
            exit 0
          fi
          if ! npx vitest run tests/e2e/gui; then
            echo "GUI e2e suite failed; the macOS run is provisional (see doc/gui.md)."
            exit 0
          fi

      # Windows still has no GPU/Vulkan driver on the hosted runner, so *running*
      # the example stays provisional (see doc/gui.md). The archive itself was
      # built by the x64 step above; Windows arm64 and a cache miss fall back to
      # building it here. Keep the job green and record a failure in the log;
      # `continue-on-error` would still annotate the run with a red error.
      - name: Build and run the GUI example (Windows, provisional)
        if: runner.os == 'Windows'
        env:
          XT_GUI_AUTOCLOSE_MS: "1500"
        run: |
          if (-not (Get-ChildItem runtime/lib/*/gui.lib -ErrorAction SilentlyContinue)) {
            npm run gui
            if ($LASTEXITCODE -ne 0) {
              Write-Host "GUI archive build failed; the Windows build is provisional (see doc/gui.md)."
              exit 0
            }
          }
          npx tsx src/cli/main.ts run examples/gui/hello.ts --ext gui --out build/examples
          if ($LASTEXITCODE -ne 0) {
            Write-Host "GUI example failed; the Windows GUI path is provisional (see doc/gui.md)."
            exit 0
          }

  self-host:
    name: Self-host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      # Same Visual Studio toolchain as the local build and the archives.
      - name: Set up the Visual Studio toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/vs-toolchain

      - name: Install dependencies
        run: npm ci

      # Bootstrap the compiler with itself and prove the emitted LLVM IR is a
      # fixpoint: source -> gen1 binary -> gen2 IR == gen1 IR.
      - name: Bootstrap and verify the self-hosted compiler
        shell: bash
        run: |
          set -euo pipefail

          # A produced executable may carry a platform suffix (.exe).
          binary() {
            if [ -f "$1/$2.exe" ]; then echo "$1/$2.exe"; else echo "$1/$2"; fi
          }

          mkdir -p scratch dist

          # Reference IR: the source (TypeScript, run through tsx) compiles itself.
          npx tsx src/cli/main.ts emit src/cli/main.ts --ext node > scratch/ref.ll

          # Generation 1: the source compiler builds itself into a native binary.
          npx tsx src/cli/main.ts build src/cli/main.ts --ext node --out scratch/self --force
          gen1="$(binary scratch/self main)"

          # Generation 2: the self-hosted binary re-emits the IR and rebuilds itself.
          "${gen1}" emit src/cli/main.ts --ext node > scratch/gen2.ll
          "${gen1}" build src/cli/main.ts --ext node --out scratch/self2 --force
          gen2="$(binary scratch/self2 main)"

          # Generation 3: the second-generation binary re-emits the IR.
          "${gen2}" emit src/cli/main.ts --ext node > scratch/gen3.ll

          # The IR must be byte-for-byte identical across generations.
          diff scratch/ref.ll scratch/gen2.ll
          diff scratch/ref.ll scratch/gen3.ll
          echo "self-hosting fixpoint verified ($(wc -l < scratch/ref.ll) IR lines)"

          # Stage the self-hosted binary under a platform-stable name.
          case "${gen1}" in
            *.exe) cp "${gen1}" dist/xbintsc.exe ;;
            *)     cp "${gen1}" dist/xbintsc ;;
          esac
          ls -l dist

      - name: Upload the self-hosted compiler
        uses: actions/upload-artifact@v7
        with:
          name: xbintsc-${{ runner.os }}-${{ runner.arch }}
          path: dist/xbintsc*
          if-no-files-found: error
          retention-days: 90

  # Assemble the release archives: the self-hosted binary plus the prebuilt
  # runtime, one per platform. No toolchain is bundled (see
  # `doc/requirements.md`). `release.yml` downloads these and attaches them to a
  # GitHub Release.
  package:
    name: Package (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    needs: self-host
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # This job builds the GUI archive too, so it needs the same X11/Wayland
      # toolchain the compile-examples job installs. Omitting it is what made
      # SDL3 configure itself without a window backend and abort here.
      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo sh scripts/install-gui-deps.sh

      # This job builds the GUI/media archives too, so it needs the same Visual
      # Studio toolchain as compile-examples (vcvarsall + its bundled LLVM) and
      # GNU make for FFmpeg's configure on x64.
      - name: Set up the Visual Studio toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/vs-toolchain
        with:
          make: "true"

      - run: npm ci

      - name: Cache the GUI and media vendored libraries
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            vendor/SDL
            vendor/freetype
            vendor/freetype-build
            vendor/harfbuzz
            vendor/harfbuzz-build
            vendor/glslang
            vendor/spirv-cross
            vendor/ffmpeg
          key: gui-vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-gui.ts', 'scripts/build-media.ts') }}

      - name: Cache the Windows GUI and media sources
        if: runner.os == 'Windows' && runner.arch == 'X64'
        uses: actions/cache@v5
        with:
          path: |
            vendor/SDL
            vendor/freetype
            vendor/harfbuzz
            vendor/glslang
            vendor/spirv-cross
            vendor/ffmpeg
            vendor/ffmpeg-build-msvc/dist
          key: windows-vendor-${{ runner.arch }}-${{ hashFiles('scripts/build-gui.ts', 'scripts/build-media.ts') }}

      - name: Download the self-hosted compiler
        uses: actions/download-artifact@v8
        with:
          name: xbintsc-${{ runner.os }}-${{ runner.arch }}
          path: dist

      - name: Build the prebuilt runtime archives
        run: npm run runtime

      # `package-release` copies all of `runtime/`, so the GUI and media archives
      # built here ship automatically. Windows x64 is built and shipped; Windows
      # arm64 still skips (FFmpeg's MSVC arm64 build is not validated yet).
      - name: Build the GUI archive
        if: runner.os != 'Windows' || runner.arch == 'X64'
        run: npm run gui

      - name: Build the media archive
        if: runner.os != 'Windows' || runner.arch == 'X64'
        run: npm run media

      - name: Assemble the release archive
        run: npm run package-release

      - name: Upload the release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          # Only the archives (and their .sha256), never the unpacked tree.
          path: dist/release/xbintsc-*.tar.*
          if-no-files-found: error
          retention-days: 90
