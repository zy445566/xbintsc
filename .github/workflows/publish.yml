name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required by npm OIDC publishing / provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `prepublishOnly` also runs `npm run build`, but building here first
      # keeps the publish step's work visible and lets us inspect the tarball.
      - name: Build
        run: npm run build

      - name: Preview package contents
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN needed: npm authenticates via GitHub OIDC
      # (id-token: write) against the npm trusted publisher config.
      - name: Publish
        run: npm publish --provenance
