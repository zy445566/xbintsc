<html>
  <head>
    <style>
      body { margin: 0; background-color: #fafafa; font-size: 16px; }
      .card {
        display: flex;
        flex-direction: column;
        width: 50%;
        padding: 8px;
        background: #ffffff;
        border-radius: 6px;
        transition: background-color 250ms ease, border-radius 250ms ease;
      }
      .card h1 { font-size: 1.5em; color: rgb(20, 22, 28); }
      #title { font-weight: bold; }
      .card > .row { margin-top: 4px; }
      .card:hover { background: #f0f4ff; border-radius: 12px; }
      #title:focus { color: #2b6cff; }

      /* Counter styling. The inline script swaps the label's class so these
         rules are what makes the counter look "reactive". */
      .counter { display: flex; align-items: center; gap: 8px; }
      .counter button { font-size: 1em; padding: 2px 10px; }
      #count { min-width: 2em; text-align: center; font-weight: bold; color: #14161c; }
      #count.pos { color: #1a8a3a; }
      #count.neg { color: #c02a2a; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <h1 id="title">Hello from xbintsc</h1>
      <div class="row">a flex row</div>
      <div class="row counter">
        <button id="dec">-</button>
        <span id="count">0</span>
        <button id="inc">+</button>
        <button id="reset">reset</button>
      </div>
    </div>
    <script lang="ts">
      // This body is compiled ahead of time (no JS engine): it just runs once
      // the document above is parsed, with `document` injected as a parameter.
      const count = document.getElementById("count");
      const inc = document.getElementById("inc");
      const dec = document.getElementById("dec");
      const reset = document.getElementById("reset");

      let n = 0;

      const render = () => {
        count.textContent = String(n);
        // Swap the class so the CSS above recolours the label: positive is
        // green, negative is red, zero is neutral.
        count.className = n > 0 ? "pos" : n < 0 ? "neg" : "";
      };

      inc.addEventListener("click", () => { n = n + 1; render(); });
      dec.addEventListener("click", () => { n = n - 1; render(); });
      reset.addEventListener("click", () => { n = 0; render(); });

      render();
    </script>
  </body>
</html>
