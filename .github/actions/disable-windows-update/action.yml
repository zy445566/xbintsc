name: Disable Windows Update

# A Windows job that spends ten minutes in an update scan, or disappears
# because the machine rebooted mid-build, is not reproducible. Windows Update
# runs as services and scheduled tasks the job never sees, so it is turned off
# before the build starts; `scripts/disable-windows-update.ps1` owns the list of
# what is changed and how to undo it.
#
# Hosted runners are thrown away after the job, so the change is scoped to it.
# A self-hosted runner keeps the change across jobs: run the script once with
# `-Restore` from an elevated prompt to put Windows Update back.
description: Turn Windows Update off for the duration of a Windows job

runs:
  using: composite
  steps:
    - name: Disable Windows Update
      shell: pwsh
      run: '& (Join-Path $env:GITHUB_WORKSPACE "scripts/disable-windows-update.ps1")'
