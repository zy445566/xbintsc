name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# xbintsc does not bundle a compiler: every job installs a clang-compatible
# toolchain and `src/driver/toolchain-provider.ts` resolves it from the system
# `PATH`. On Windows the target ABI is MSVC, so each Windows job imports the
# Visual Studio build environment (`vcvarsall`) before running anything.
#
# Every host architecture is covered, but these are native builds, not
# cross-compilation: each runner builds and tests its own architecture.
#   Linux x64      -> ubuntu-latest
#   Linux arm64    -> ubuntu-24.04-arm
#   macOS x64      -> macos-15-intel
#   macOS arm64    -> macos-15
#   Windows x64    -> windows-latest
#   Windows arm64  -> windows-11-arm

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
        node: ["22","26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        # 'llvm' carries llvm-profdata/llvm-cov, which the runtime coverage
        # report below needs alongside clang.
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Install clang (Windows x64)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # clang on Windows needs the MSVC/SDK environment (INCLUDE, LIB, PATH) to
      # find the C standard library headers, the import libraries and the
      # linker. Import the Visual Studio build environment directly instead of
      # depending on the deprecated ilammy/msvc-dev-cmd action. Windows on ARM
      # uses the image's clang (its default target is MSVC), plus the ARM64
      # MSVC tools.
      - name: Set up the MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $component = if ($arch -eq 'arm64') { 'Microsoft.VisualStudio.Component.VC.Tools.arm64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found." }

          $vsPath = (& $vswhere -latest -products * -requires $component -property installationPath).Trim()
          if (-not $vsPath) { throw "Visual Studio C++ build tools ($component) were not found." }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }

          cmd /c "`"$vcvars`" $arch && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Verify the toolchain
        shell: bash
        run: clang --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build the runtime (and prebuilt archives)
        run: npm run runtime

      - name: Report the resolved toolchain
        run: npx tsx src/cli/main.ts doctor

      # Coverage is enforced here: `vitest run --coverage` fails the job when
      # the global thresholds in vitest.config.ts are not met. The same run also
      # instruments the C runtime through clang: `CCC_OVERRIDE_OPTIONS` appends
      # the LLVM coverage flags to every compile/link the driver performs, so
      # `runtime/` can be reported next (V8 cannot see it).
      - name: Unit and end-to-end tests (with coverage)
        shell: bash
        env:
          CCC_OVERRIDE_OPTIONS: "+-fprofile-instr-generate +-fcoverage-mapping"
          LLVM_PROFILE_FILE: "${{ github.workspace }}/build/runtime-prof/%p-%m.profraw"
          xbintsc_CACHE_DIR: "${{ github.workspace }}/build/runtime-cov-cache"
          # A prebuilt runtime/lib archive is not instrumented; compile instead.
          xbintsc_PREFER_PREBUILT: "0"
        run: |
          mkdir -p build/runtime-prof
          npm test -- --coverage

      # Reports the C runtime coverage gathered above, and enforces a floor.
      # The script skips (rather than fails) on a host without a matching
      # llvm-profdata/llvm-cov, so the gate only applies where it can measure.
      # A full local run reaches ~85%; 80 leaves headroom for per-platform
      # differences in the compiled extensions.
      - name: Runtime (C) coverage
        run: npm run coverage:runtime -- --report-only --threshold 80

  compile-examples:
    name: Compile examples (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install clang (Windows x64)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up the MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $component = if ($arch -eq 'arm64') { 'Microsoft.VisualStudio.Component.VC.Tools.arm64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found." }

          $vsPath = (& $vswhere -latest -products * -requires $component -property installationPath).Trim()
          if (-not $vsPath) { throw "Visual Studio C++ build tools ($component) were not found." }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }

          cmd /c "`"$vcvars`" $arch && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - run: npm ci

      - name: Build the hello example
        run: npx tsx src/cli/main.ts build examples/hello.ts --out build/examples

      - name: Run the hello example (the CLI resolves the executable path per OS)
        run: npx tsx src/cli/main.ts run examples/hello.ts --out build/examples

      - name: Build and run the file-reading example with the node extension
        run: npx tsx src/cli/main.ts run examples/node/read.ts --ext node --out build/examples

      # Native (C++/Rust) extensions are compiled to `extern "C"` objects/static
      # libraries and linked by xbintsc. The Windows job links with the MSVC ABI
      # (the system clang plus the Visual Studio tools), and each manifest's
      # `linkerFlagsByPlatform` block carries the platform-specific runtime
      # libraries.
      - name: Build the C++ native extension
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            export CXX=clang++
          fi
          bash examples/extensions/cpp/build.sh

      - name: Run the C++ native extension example
        run: npx tsx src/cli/main.ts run examples/extensions/cpp/demo.ts --ext-native examples/extensions/cpp/xbintsc.manifest.json --out build/examples

      - name: Build the Rust native extension
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            case "${{ runner.arch }}" in
              ARM64) rust_target=aarch64-pc-windows-msvc ;;
              *)     rust_target=x86_64-pc-windows-msvc ;;
            esac
            rustup target add "$rust_target"
            export RUST_TARGET="$rust_target"
          fi
          bash examples/extensions/rust/build.sh

      - name: Run the Rust native extension example
        run: npx tsx src/cli/main.ts run examples/extensions/rust/demo.ts --ext-native examples/extensions/rust/xbintsc.manifest.json --out build/examples

  self-host:
    name: Self-host (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install a C compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install clang (Windows x64)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up the MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $component = if ($arch -eq 'arm64') { 'Microsoft.VisualStudio.Component.VC.Tools.arm64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found." }

          $vsPath = (& $vswhere -latest -products * -requires $component -property installationPath).Trim()
          if (-not $vsPath) { throw "Visual Studio C++ build tools ($component) were not found." }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }

          cmd /c "`"$vcvars`" $arch && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Install dependencies
        run: npm ci

      # Bootstrap the compiler with itself and prove the emitted LLVM IR is a
      # fixpoint: source -> gen1 binary -> gen2 IR == gen1 IR.
      - name: Bootstrap and verify the self-hosted compiler
        shell: bash
        run: |
          set -euo pipefail

          # A produced executable may carry a platform suffix (.exe).
          binary() {
            if [ -f "$1/$2.exe" ]; then echo "$1/$2.exe"; else echo "$1/$2"; fi
          }

          mkdir -p scratch dist

          # Reference IR: the source (TypeScript, run through tsx) compiles itself.
          npx tsx src/cli/main.ts emit src/cli/main.ts --ext node > scratch/ref.ll

          # Generation 1: the source compiler builds itself into a native binary.
          npx tsx src/cli/main.ts build src/cli/main.ts --ext node --out scratch/self --force
          gen1="$(binary scratch/self main)"

          # Generation 2: the self-hosted binary re-emits the IR and rebuilds itself.
          "${gen1}" emit src/cli/main.ts --ext node > scratch/gen2.ll
          "${gen1}" build src/cli/main.ts --ext node --out scratch/self2 --force
          gen2="$(binary scratch/self2 main)"

          # Generation 3: the second-generation binary re-emits the IR.
          "${gen2}" emit src/cli/main.ts --ext node > scratch/gen3.ll

          # The IR must be byte-for-byte identical across generations.
          diff scratch/ref.ll scratch/gen2.ll
          diff scratch/ref.ll scratch/gen3.ll
          echo "self-hosting fixpoint verified ($(wc -l < scratch/ref.ll) IR lines)"

          # Stage the self-hosted binary under a platform-stable name.
          case "${gen1}" in
            *.exe) cp "${gen1}" dist/xbintsc.exe ;;
            *)     cp "${gen1}" dist/xbintsc ;;
          esac
          ls -l dist

      - name: Upload the self-hosted compiler
        uses: actions/upload-artifact@v7
        with:
          name: xbintsc-${{ runner.os }}-${{ runner.arch }}
          path: dist/xbintsc*
          if-no-files-found: error
          retention-days: 90

  # Assemble the release archives: the self-hosted binary plus the prebuilt
  # runtime, one per platform. No toolchain is bundled (see
  # `doc/requirements.md`). `release.yml` downloads these and attaches them to a
  # GitHub Release.
  package:
    name: Package (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    needs: self-host
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x64
          - ubuntu-24.04-arm     # Linux arm64
          - macos-15-intel       # macOS x64
          - macos-15             # macOS arm64
          - windows-latest       # Windows x64
          - windows-11-arm       # Windows arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Download the self-hosted compiler
        uses: actions/download-artifact@v8
        with:
          name: xbintsc-${{ runner.os }}-${{ runner.arch }}
          path: dist

      - name: Build the prebuilt runtime archives
        run: npm run runtime

      - name: Assemble the release archive
        run: npm run package-release

      - name: Upload the release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          # Only the archives (and their .sha256), never the unpacked tree.
          path: dist/release/xbintsc-*.tar.*
          if-no-files-found: error
          retention-days: 90
