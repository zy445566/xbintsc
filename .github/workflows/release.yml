name: Release

# Manually triggered release for a version that has already been committed.
#
# The version bump is NOT done here: update package.json and package-lock.json,
# commit that change and push it, then let CI build that commit before
# dispatching this workflow. It releases the version found in package.json at
# the dispatched ref - so a CI run id for that same commit can be supplied
# as-is - tags that exact commit, publishes to npm, and creates the GitHub
# Release with the self-hosted binaries CI built for it.
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI run id holding the self-hosted binaries (default: the successful CI run for the released commit)"
        required: false
        type: string

# Serialize runs so two quick dispatches cannot race on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the release tag, create the GitHub release
  actions: write # dispatch the CI workflow and download its artifacts
  id-token: write # required by npm OIDC publishing / provenance

jobs:
  release:
    name: Tag, publish and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch tags so the version/tag checks are accurate
          token: ${{ secrets.GITHUB_TOKEN }}

      # The version comes from the committed package.json. This step only reads
      # it and makes sure the matching tag sits on this exact commit: the version
      # commit is authored and pushed by hand, never here.
      - name: Resolve the version and ensure the release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current="$(node -p "require('./package.json').version")"
          tag="v${current}"
          sha="$(git rev-parse HEAD)"

          # A tag that already exists must point at the commit being released;
          # reusing an older tag would attach the wrong binaries to the release.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged="$(git rev-list -n 1 "${tag}")"
            if [ "${tagged}" != "${sha}" ]; then
              echo "::error::Tag ${tag} already exists on ${tagged}, not on the release commit ${sha}." >&2
              exit 1
            fi
            echo "Tag ${tag} already points at ${sha}."
          else
            git tag "${tag}" "${sha}"
            git push origin "refs/tags/${tag}"
          fi

          echo "release version : ${current}"
          echo "release tag     : ${tag}"
          echo "release commit  : ${sha}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${current}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A human-pushed version commit already triggers CI, but this fallback keeps
      # the release self-sufficient when no run id is supplied: ci.yml does not
      # run on tags, so dispatch it on the release tag and pin it to exactly this
      # commit. The download step below waits for that run.
      - name: Dispatch CI for the release commit
        if: ${{ inputs.ci_run_id == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run ci.yml --ref "${TAG}"

      # `prepublishOnly` also runs `npm run build`, but building here first
      # keeps the publish step's work visible and lets us inspect the tarball.
      - name: Build
        run: npm run build

      - name: Preview package contents
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN needed: npm authenticates via GitHub OIDC
      # (id-token: write) against the npm trusted publisher config.
      - name: Publish to npm
        run: npm publish --provenance

      # Collect the self-contained archives that CI assembled for the release
      # commit, and stage them under release-friendly names. Raw per-platform
      # binaries (e.g. .exe) are intentionally not published.
      - name: Download the self-contained release archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          INPUT_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail

          # Either use an explicitly requested CI run, or wait (bounded) for the
          # CI run covering the release commit to finish, so a release dispatched
          # right after the version push still finds its binaries.
          run_id="${INPUT_RUN_ID:-}"
          conclusion=""
          if [ -n "${run_id}" ]; then
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
          else
            deadline=$(( SECONDS + 1800 ))
            while :; do
              read -r run_id status conclusion <<<"$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last | "\(.id) \(.status) \(.conclusion)"')"

              if [ -n "${run_id}" ] && [ "${run_id}" != "null" ] && [ "${status}" = "completed" ]; then
                break
              fi
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "::error::Timed out waiting for a CI run for ${SHA}." >&2
                exit 1
              fi
              echo "Waiting for CI run for ${SHA} (status: ${status:-none})..."
              sleep 20
            done
          fi

          if [ "${conclusion}" != "success" ]; then
            echo "::error::CI run ${run_id} concluded '${conclusion}'; cannot fetch self-hosted binaries." >&2
            exit 1
          fi

          # The binaries must come from the release commit. A hand-supplied
          # `ci_run_id` (or a missing SHA in the query above) can otherwise point
          # at a run from an earlier commit, whose archives still carry the
          # previous version number (e.g. xbintsc-0.3.9-* on a v0.3.10 release).
          run_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha')"
          if [ "${run_sha}" != "${SHA}" ]; then
            echo "::error::CI run ${run_id} is for commit ${run_sha}, not the release commit ${SHA}." >&2
            exit 1
          fi
          echo "Using binaries from CI run ${run_id}."

          rm -rf .ci-artifacts release-assets
          # Only the self-contained archives assembled by the `package` job are
          # published; the raw self-hosted binaries are left out of the release.
          gh run download "${run_id}" --pattern 'release-*' --dir .ci-artifacts

          mkdir -p release-assets
          shopt -s nullglob
          # Archives are already named xbintsc-<version>-<os>-<arch>.tar.{gz,zst}
          # (+ .sha256), so copy them through verbatim.
          for dir in .ci-artifacts/release-*; do
            [ -d "${dir}" ] || continue
            for file in "${dir}"/*; do
              [ -f "${file}" ] || continue
              cp "${file}" "release-assets/$(basename "${file}")"
            done
          done

          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No release artifacts were found in CI run ${run_id}." >&2
            exit 1
          fi

          # Belt-and-braces: every archive must embed the version being
          # released, so a version/tag mismatch can never reach the release.
          for file in release-assets/*; do
            base="$(basename "${file}")"
            case "${base}" in
              "xbintsc-${VERSION}-"*) ;;
              *)
                echo "::error::Release asset ${base} does not match version ${VERSION}." >&2
                exit 1
                ;;
            esac
          done
          ls -l release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "${TAG}" --title "${TAG}" --generate-notes release-assets/*
